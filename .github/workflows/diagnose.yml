name: Diagnose env (one-off)

# Manual-only. Prints shape/length/URL-parse-validity of every real
# credential this repo uses — never the raw value — to root-cause the
# cron's "Invalid URL" / API-key-rejected failures. Delete this workflow
# (and src/cli/diagnose-env.ts) once that's found.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run diagnose-env
        env:
          AGENT_DATABASE_URL: ${{ secrets.AGENT_DATABASE_URL }}
          HARTWICH_DATABASE_URL: ${{ secrets.HARTWICH_DATABASE_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_ACCESS_TOKEN_1: ${{ secrets.GMAIL_ACCESS_TOKEN_1 }}
          GMAIL_REFRESH_TOKEN_1: ${{ secrets.GMAIL_REFRESH_TOKEN_1 }}
          GMAIL_FROM_ADDRESS_1: ${{ secrets.GMAIL_FROM_ADDRESS_1 }}
          HARTWICH_APP_URL: ${{ secrets.HARTWICH_APP_URL }}
          GAVIN_EMAIL: ${{ secrets.GAVIN_EMAIL }}
